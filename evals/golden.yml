# Golden questions with hand-written SQL, independent of the semantic layer and compiler.
# Execution accuracy compares the agent's result set to the golden result set.
- question: What were total net sales in 2025?
  sql: select sum(net_sales) from marts.fct_prescriptions where rx_date between '2025-01-01' and '2025-12-31'
- question: Which region had the highest net sales in 2025?
  ordered: true
  sql: |
    select p.region, sum(f.net_sales) s from marts.fct_prescriptions f join marts.dim_prescribers p using (prescriber_id)
    where rx_date between '2025-01-01' and '2025-12-31' group by 1 order by 2 desc limit 1
- question: Top 3 territories by TRx last quarter
  ordered: true
  sql: |
    select p.territory, count(*) from marts.fct_prescriptions f join marts.dim_prescribers p using (prescriber_id)
    where rx_date between '2026-04-01' and '2026-06-30' group by 1 order by 2 desc limit 3
- question: Monthly NRx for Xelvora this year
  ordered: true
  sql: |
    select date_trunc('month', rx_date), sum(is_new_rx) from marts.fct_prescriptions f join marts.dim_products d using (product_id)
    where d.brand = 'Xelvora' and rx_date between '2026-01-01' and '2026-09-30' group by 1 order by 1
- question: Own brand share by therapeutic area in Q3 2026
  sql: |
    select d.therapeutic_area, sum(case when d.is_own_brand then f.net_sales else 0 end) / sum(f.net_sales)
    from marts.fct_prescriptions f join marts.dim_products d using (product_id)
    where rx_date between '2026-07-01' and '2026-09-30' group by 1
- question: Net sales by payer type for Cardiology in 2025
  sql: |
    select f.payer_type, sum(f.net_sales) from marts.fct_prescriptions f join marts.dim_prescribers p using (prescriber_id)
    where p.specialty = 'Cardiology' and rx_date between '2025-01-01' and '2025-12-31' group by 1
- question: How many active prescribers did we have in the Southeast last year?
  sql: |
    select count(distinct f.prescriber_id) from marts.fct_prescriptions f join marts.dim_prescribers p using (prescriber_id)
    where p.region = 'Southeast' and rx_date between '2025-01-01' and '2025-12-31'
- question: Average sales per Rx by brand
  sql: |
    select d.brand, sum(f.net_sales) / count(*) from marts.fct_prescriptions f join marts.dim_products d using (product_id) group by 1
- question: Quarterly TRx for Respiquel in the Northeast
  ordered: true
  sql: |
    select date_trunc('quarter', rx_date), count(*) from marts.fct_prescriptions f
    join marts.dim_products d using (product_id) join marts.dim_prescribers p using (prescriber_id)
    where d.brand = 'Respiquel' and p.region = 'Northeast' group by 1 order by 1
- question: Which specialty wrote the most new prescriptions in March 2026?
  ordered: true
  sql: |
    select p.specialty, sum(is_new_rx) from marts.fct_prescriptions f join marts.dim_prescribers p using (prescriber_id)
    where rx_date between '2026-03-01' and '2026-03-31' group by 1 order by 2 desc limit 1
- question: Net sales and TRx by region year to date
  sql: |
    select p.region, sum(f.net_sales), count(*) from marts.fct_prescriptions f join marts.dim_prescribers p using (prescriber_id)
    where rx_date between '2026-01-01' and '2026-09-30' group by 1
- question: Bottom 2 brands by net sales in Q1 2026
  ordered: true
  sql: |
    select d.brand, sum(f.net_sales) from marts.fct_prescriptions f join marts.dim_products d using (product_id)
    where rx_date between '2026-01-01' and '2026-03-31' group by 1 order by 2 asc limit 2
- question: Our share in Diabetes over the past 12 months
  sql: |
    select sum(case when d.is_own_brand then f.net_sales else 0 end) / sum(f.net_sales)
    from marts.fct_prescriptions f join marts.dim_products d using (product_id)
    where d.therapeutic_area = 'Diabetes' and rx_date between '2025-10-01' and '2026-09-30'
